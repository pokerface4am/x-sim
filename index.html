<script>
// X 起号模拟器：游戏逻辑（不依赖 DOM，可在 node 里跑自动试玩）
// 数据表（NICHES / ORIGINS / TPL / HOTS / RIVALS / EVENTS / ENDINGS / ACHS）在 data-*.js 里。

var CFG = {
  TURNS: 23,
  DPT: 4,         // 每回合代表几天
  B0: 220,        // 零粉丝时的基础触达
  kF: 0.8,        // 每个有效粉丝带来的触达
  W_BASE: 0.07,   // 每回合账号权重自然增长
  W_POST: 0.075,  // 每发一条帖子的权重增长（每回合最多算 4 条）
  LIMIT_MUL: 0.3, // 限流时的触达倍率
  EVENT_P: 0.85,
  CONV: 4.4
};

// 帖子类型：mul 内容倍率，conv 浏览转粉率，q 粉丝质量，vp 爆款概率，sd 运气方差
var PT = {
  short:  { n: '短评',   mul: 0.6, conv: 0.004,  q: 0.6,  vp: 0.03, sd: 0.9 },
  hot:    { n: '蹭热点', mul: 0.9, conv: 0.004,  q: 0.45, vp: 0.07, sd: 1.3 },
  tut:    { n: '教程',   mul: 2.7, conv: 0.0075, q: 0.9,  vp: 0.03, sd: 0.7 },
  long:   { n: '长文',   mul: 5.2, conv: 0.0085, q: 0.95, vp: 0.05, sd: 0.8 },
  video:  { n: '视频',   mul: 4.0, conv: 0.007,  q: 0.8,  vp: 0.06, sd: 0.9 },
  gift:   { n: '福利',   mul: 1.6, conv: 0.0055, q: 0.25,  vp: 0.03, sd: 0.7 },
  lottery:{ n: '抽奖',   mul: 3.2, conv: 0.022,  q: 0.12, vp: 0.02, sd: 0.5 },
  repost: { n: '搬运',   mul: 1.3, conv: 0.0045, q: 0.5,  vp: 0.05, sd: 1.0 },
  fight:  { n: '挂人',   mul: 3.0, conv: 0.005,  q: 0.4,  vp: 0.14, sd: 1.1 },
  ad:     { n: '广告',   mul: 0.45, conv: 0.0006, q: 0.5,  vp: 0.004, sd: 0.6 }
};

// ---------- 随机数（状态存在 s.rs 里，存档可复现） ----------
function rnd(s) {
  s.rs = (s.rs + 0x6D2B79F5) | 0;
  var t = Math.imul(s.rs ^ (s.rs >>> 15), 1 | s.rs);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function chance(s, p) { return rnd(s) < p; }
function rint(s, a, b) { return a + Math.floor(rnd(s) * (b - a + 1)); }
function pick(s, arr) { return arr[Math.floor(rnd(s) * arr.length)]; }
function gauss(s) {
  var u = 0; while (u === 0) u = rnd(s);
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd(s));
}
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function byId(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
function N(s, id) { return s.niche === id; }
function realPct(s) { return s.F > 0 ? clamp(s.rF / s.F, 0, 1) : 1; }
function fmt(n) {
  n = Math.round(n);
  if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '亿';
  if (n >= 10000) return (n / 10000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, '') + '万';
  return String(n);
}

// ---------- 状态修改 ----------
function addF(s, n, q) {
  n = Math.round(n); if (n <= 0) return 0;
  s.F += n; s.rF += n * (q == null ? 0.6 : q);
  if (s.F > s.st.peak) s.st.peak = s.F;
  return n;
}
function loseF(s, n) {
  n = Math.min(Math.round(n), s.F); if (n <= 0) return 0;
  var r = realPct(s);
  s.F -= n; s.rF = Math.max(0, s.rF - n * r);
  return n;
}
function loseFake(s, n) { // 只掉低质量粉
  var fake = Math.max(0, s.F - s.rF);
  n = Math.min(Math.round(n), Math.round(fake)); if (n <= 0) return 0;
  s.F -= n; return n;
}
function fx(s, o) {
  if (o.f) { if (o.f > 0) addF(s, o.f, o.q); else loseF(s, -o.f); }
  if (o.fp) { var d = Math.round(s.F * o.fp); if (d >= 0) addF(s, d, o.q); else loseF(s, -d); }
  if (o.mood) s.mood = clamp(s.mood + o.mood, 0, 100);
  if (o.risk) {
    s.risk = clamp(s.risk + o.risk, 0, 100);
    if (o.risk > 0) { var k = o.rk || 'other'; s.riskBy[k] = (s.riskBy[k] || 0) + o.risk; s.riskyTurn = true; }
  }
  if (o.money) { s.money += o.money; if (o.money > 0) s.st.earned += o.money; }
  if (o.rep) s.rep = clamp(s.rep + o.rep, 0, 100);
  if (o.w) s.W = Math.max(0.6, s.W + o.w);
  if (o.en) s.enNext += o.en;
  if (o.flag) s.fl[o.flag] = s.turn;
  if (o.end) endGame(s, o.end);
}
function has(s, flag) { return s.fl[flag] != null; }
function since(s, flag) { return s.fl[flag] == null ? -1 : s.turn - s.fl[flag]; }
function say(s, k, text, extra) {
  var it = { k: k, t: text, turn: s.turn, id: ++s.fid };
  if (extra) for (var key in extra) it[key] = extra[key];
  s.feed.push(it);
  if (s.feed.length > 80) s.feed.splice(0, s.feed.length - 80);
  return it;
}
function endGame(s, id) { if (!s.ended) { s.ended = true; s.endId = id; } }

// ---------- 开局 ----------
function newGame(opt) {
  var seed = (opt.seed == null ? Math.floor(Math.random() * 2147483647) : opt.seed) | 0;
  var s = {
    v: 1, seed: seed, rs: seed, turn: 1, phase: 'start',
    niche: opt.niche, origin: opt.origin, name: opt.name || '',
    F: 0, rF: 0, mood: 70, risk: 0, money: 300, rep: 50, W: 1,
    enBase: 4, energy: 4, enNext: 0, income: 0, moodMul: 1,
    riskBy: {}, riskyTurn: false, fl: {}, seen: {}, seenN: {}, c: {},
    blue: 0, frozen: false, limited: false, exp: 0,
    tp: [], feed: [], fid: 0, hot: null, ev: null, boughtThisTurn: false,
    rv: {}, ended: false, endId: null,
    st: { posts: 0, tutLong: 0, maxViews: 0, totalViews: 0, virals: 0, switches: 0, freezes: 0,
          bigv: 0, earned: 0, peak: 0, blueTurns: 0, flops: 0, acts: 0, limitedTurns: 0, niches: [opt.niche] }
  };
  var o = byId(ORIGINS, opt.origin);
  if (o && o.init) o.init(s);
  RIVALS.forEach(function (r) {
    s.rv[r.id] = { F: Math.round(r.f0 * (0.7 + rnd(s) * 0.6)), arcT: rint(s, 5, 21), done: false, gone: false };
  });
  say(s, 'sys', '账号注册成功。0 关注，0 粉丝。头像还是个灰色的蛋。');
  return s;
}

// ---------- 回合开始 ----------
function startTurn(s) {
  s.phase = 'act';
  s.tp = []; s.riskyTurn = false; s.boughtThisTurn = false; s.ev = null;
  var en = s.enBase + s.enNext; s.enNext = 0;
  s.notes = [];
  if (s.mood < 30) { en -= 1; s.notes.push('心态太差，这几天提不起劲，精力 -1。'); }
  var o = byId(ORIGINS, s.origin);
  if (o && o.turn) o.turn(s, function (d) { en += d; });
  s.energy = Math.max(1, en);
  s.hot = HOTS[Math.floor(rnd(s) * HOTS.length)].id;
  if (s.frozen) {
    s.energy = 0; s.st.freezes++; s.ev = 'appeal';
    say(s, 'sys', '你的账号已被冻结。原因：「违反了平台规则」。具体哪条，没说。');
    return s;
  }
  if (s.turn >= 2 && chance(s, CFG.EVENT_P)) s.ev = pickEvent(s);
  return s;
}
function eligible(s, e) {
  if (e.special) return false;
  if (s.seen[e.id] && !e.rep) return false;
  if (e.min && s.turn < Math.round(e.min * 0.67)) return false;
  if (e.max && s.turn > Math.round(e.max * 0.67)) return false;
  if (e.if && !e.if(s)) return false;
  return true;
}
function pickEvent(s) {
  var pool = [], total = 0;
  for (var i = 0; i < EVENTS.length; i++) {
    var e = EVENTS[i];
    if (!eligible(s, e)) continue;
    var w = e.w || 1;
    pool.push([e, w]); total += w;
  }
  if (!pool.length) return null;
  var x = rnd(s) * total;
  for (var j = 0; j < pool.length; j++) { x -= pool[j][1]; if (x <= 0) return pool[j][0].id; }
  return pool[pool.length - 1][0].id;
}
function currentEvent(s) { return s.ev ? byId(EVENTS, s.ev) : null; }
function eventText(s, e) { return typeof e.t === 'function' ? e.t(s) : e.t; }
function eventOptions(s, e) {
  return e.o.map(function (o, i) {
    return { i: i, label: o[0], ok: o[2] ? !!o[2](s) : true, why: o[3] || '' };
  });
}
function chooseEvent(s, idx) {
  var e = currentEvent(s); if (!e) return '';
  var o = e.o[idx]; if (!o) return '';
  if (o[2] && !o[2](s)) return '';
  s.seen[e.id] = (s.seen[e.id] || 0) + 1;
  var res = o[1](s) || '';
  if (e.id === 'appeal') s.frozen = false;
  s.ev = null;
  say(s, 'event', res, { title: e.title || '' });
  checkInstant(s);
  return res;
}

// ---------- 行动 ----------
function mkText(s, type) {
  var nc = byId(NICHES, s.niche);
  var pool = (TPL[type] || TPL.short).slice();
  var own = nc.tpl && nc.tpl[type]; if (own) pool = pool.concat(own, own);
  var t = pick(s, pool);
  var hot = byId(HOTS, s.hot);
  return t.replace(/\{a\}/g, function () { return pick(s, nc.a); })
          .replace(/\{b\}/g, function () { return pick(s, nc.b); })
          .replace(/\{h\}/g, hot ? hot.n : '');
}
function post(s, type, extra) {
  var p = { type: type, text: mkText(s, type), niche: s.niche };
  if (extra) for (var k in extra) p[k] = extra[k];
  s.tp.push(p);
  var nc = byId(NICHES, s.niche);
  if (nc.rp && type !== 'ad') fx(s, { risk: nc.rp, rk: nc.rk });
  return p;
}
function cnt(s, id) { return s.c[id] || 0; }

var ACTIONS = [
  { id: 'short', n: '发短评', e: 1, d: '随手一句。浏览低，偶尔莫名其妙地爆。',
    run: function (s) { post(s, 'short'); return pick(s, ['发了一条短评。', '打了一句话，删了，重打一遍，发了。', '蹲在马桶上发了一条。', '想了十分钟，发了十一个字。']); } },
  { id: 'hot', n: '蹭热点', e: 1, d: '蹭对了起飞，蹭错了翻车。',
    run: function (s) { post(s, 'hot'); return '蹭上了「' + byId(HOTS, s.hot).n + '」。'; } },
  { id: 'tut', n: '写教程', e: 2, d: '浏览高且稳，来的都是真粉。',
    run: function (s) { post(s, 'tut'); return pick(s, ['写了一篇教程，截了 9 张图。', '教程写完了。其中有两步你自己也是昨天刚学会的。', '写教程写到一半，发现自己之前一直做错了。改了，发了。']); } },
  { id: 'long', n: '写长文', e: 3, d: '上限最高。也可能写三小时，三个赞。',
    run: function (s) { post(s, 'long'); return pick(s, ['写完一篇长文，检查了四遍错别字。', '长文写了三个小时，其中两个小时在想标题。', '写了四千字。发出去之前删掉了最真诚的那一段。']); } },
  { id: 'video', n: '做视频', e: 3, d: '浏览高。头几次大概率剪得很烂。',
    run: function (s) { post(s, 'video', { nth: cnt(s, 'video') }); return pick(s, ['视频导出了三次才成功。', '录了十一遍，用的是第二遍。', '剪完视频，发现全程没开麦。重录。']); } },
  { id: 'gift', n: '发福利', e: 1, d: '羊毛帖浏览高，来的人领完就走。',
    run: function (s) { post(s, 'gift'); return pick(s, ['发了一条羊毛信息。', '把别人群里的羊毛转了出来，假装是自己发现的。']); } },
  { id: 'repost', n: '搬运', e: 1, d: '别人的内容，你的数据。有风险。',
    run: function (s) { post(s, 'repost'); fx(s, { risk: 7, rk: 'repost' }); return pick(s, ['搬了一条，顺手把水印裁了。', '搬了一条。翻译软件翻的，你润色了一个标点。', '搬了一条，在结尾加了一句「你怎么看」。']); } },
  { id: 'replyv', n: '回复大V', e: 1, d: '在大V评论区抢前排。小概率被翻牌。',
    run: function (s) {
      var reach = reachOf(s) * 0.06 * Math.exp(gauss(s) * 0.8);
      var g = addF(s, reach * 0.01 + rint(s, 0, 3), 0.6);
      s.st.totalViews += Math.round(reach);
      var r = rnd(s);
      if (r < 0.045) {
        var big = Math.round(200 + reachOf(s) * 0.5 * (0.5 + rnd(s)));
        addF(s, big, 0.5); s.st.bigv++; fx(s, { mood: 12, flag: 'bigv' });
        say(s, 'sys', '大V回复了你一个「哈哈哈」。你的通知栏炸了，涨粉 ' + fmt(big) + '。');
        return '大V翻了你的牌。';
      }
      if (r < 0.075) { fx(s, { mood: -6 }); say(s, 'sys', '你发现自己被那个大V拉黑了。你回的是「说得对」。'); return '被拉黑了。'; }
      return '抢到了第 ' + rint(s, 3, 60) + ' 楼，涨粉 ' + g + '。';
    } },
  { id: 'replyown', n: '回评论区', e: 1, d: '粉丝多了才有用。涨口碑，养铁粉。',
    run: function (s) {
      if (s.F < 200) { fx(s, { mood: -2 }); return '评论区只有一个卖币的机器人。你回了它。'; }
      var conv = Math.min(s.F - s.rF, s.F * 0.012);
      s.rF += Math.max(0, conv); fx(s, { rep: 3, mood: 2, w: 0.03 });
      return '回了四十多条评论，有人说「博主居然回我了」。';
    } },
  { id: 'group', n: '进互推群', e: 1, d: '涨得快。来的人和你一样，只想涨粉。',
    run: function (s) {
      if (chance(s, 0.1)) { fx(s, { money: -50, mood: -4 }); return '群主收了 50 块入群费，然后把群解散了。'; }
      var g = addF(s, (120 + s.F * 0.05) * (0.6 + rnd(s) * 0.8), 0.18);
      fx(s, { risk: 4, rk: 'group' });
      return '在群里接龙互关，涨粉 ' + fmt(g) + '。其中没有一个人会看你的帖子。';
    } },
  { id: 'buy', n: '买粉', e: 0, m: 150, d: '150 块。数字立刻好看，后果以后再说。',
    ok: function (s) { return !s.boughtThisTurn; }, why: '这几天已经买过了',
    run: function (s) {
      s.boughtThisTurn = true;
      var g = addF(s, Math.max(600, s.F * 0.2) * (0.8 + rnd(s) * 0.4), 0.02);
      fx(s, { risk: 14, rk: 'buy', flag: 'bought' });
      return '到账 ' + fmt(g) + ' 个粉丝，头像清一色是风景照。';
    } },
  { id: 'lottery', n: '抽奖', e: 1, m: 300, d: '300 块奖品。涨粉快，开奖后掉得也快。',
    run: function (s) { post(s, 'lottery'); return '发了抽奖帖：关注加转发，抽一位送 300 块。'; } },
  { id: 'blue', n: '开蓝标', e: 0, m: 80, d: '80 块管 7 回合。触达小幅提升。',
    ok: function (s) { return s.blue <= 0; }, why: '蓝标还没到期',
    run: function (s) { s.blue = 7; fx(s, { flag: 'blue' }); return '你有蓝标了。感觉自己说话都硬气了一点。'; } },
  { id: 'fight', n: '挂人吵架', e: 1, d: '流量来得最快的办法。代价也来得快。',
    run: function (s) {
      post(s, 'fight'); fx(s, { risk: 8, rk: 'fight', rep: -3, mood: rint(s, -8, 6) });
      if (chance(s, 0.14)) { fx(s, { mood: -12, fp: -0.03 }); return '你挂的那个人粉丝是你的二十倍。他的粉丝来了。'; }
      return '你截图挂了一个人，配文「大家评评理」。';
    } },
  { id: 'sell', n: '带货', e: 1, d: '需要 800 粉。挂个链接，赚点佣金。',
    ok: function (s) { return s.F >= 800; }, why: '粉丝不到 800',
    run: function (s) {
      var nc = byId(NICHES, s.niche);
      var m = Math.round(s.rF * 0.012 * nc.monet * Math.exp(gauss(s) * 0.7)) + rint(s, 0, 20);
      post(s, 'ad'); fx(s, { money: m, rep: -2 });
      return '挂了个链接，佣金到账 ' + m + ' 块。';
    } },
  { id: 'ad', n: '接广告', e: 1, d: '需要 2000 粉。按粉丝数报价，掉口碑。',
    ok: function (s) { return s.F >= 2000; }, why: '粉丝不到 2000',
    run: function (s) {
      var nc = byId(NICHES, s.niche);
      var m = Math.round(60 + s.F * 0.025 * nc.monet * (0.6 + rnd(s) * 0.8));
      post(s, 'ad'); fx(s, { money: m, rep: -4 });
      return '接了一条广告，' + m + ' 块。甲方让你把「广告」两个字写小一点。';
    } },
  { id: 'course', n: '卖课', e: 1, d: '需要 5000 粉。来钱最快，口碑掉得也最快。',
    ok: function (s) { return s.F >= 5000; }, why: '粉丝不到 5000',
    run: function (s) {
      var nc = byId(NICHES, s.niche);
      var m = Math.round(s.F * 0.22 * nc.monet * (0.3 + rnd(s) * 1.2));
      post(s, 'ad'); fx(s, { money: m, rep: -12, risk: 5, rk: 'course', flag: 'course' });
      return '《从 0 到 1 起号实战营》开售，收款 ' + fmt(m) + ' 块。你自己起号才 ' + s.turn * CFG.DPT + ' 天。';
    } },
  { id: 'switch', n: '换赛道', e: 2, d: '掉一批粉，换一种活法。', param: 'niche',
    run: function (s, to) {
      if (!to || to === s.niche || !byId(NICHES, to)) return null;
      var lost = loseF(s, s.F * 0.15);
      s.niche = to; s.st.switches++; fx(s, { w: -0.25 });
      if (s.st.niches.indexOf(to) < 0) s.st.niches.push(to);
      return '改了简介和头像，现在是「' + byId(NICHES, to).n + '」博主。掉粉 ' + fmt(lost) + '。';
    } },
  { id: 'rest', n: '休息', e: 1, d: '放下手机。回心态，降一点风险。',
    run: function (s) { fx(s, { mood: 14, risk: -3 }); return pick(s, ['你把手机放在客厅，去睡了一觉。', '出门走了走，发现外面的人都不认识什么大V。', '一整天没打开 X。也没发生什么。']); } }
];

function actionList(s) {
  return ACTIONS.map(function (a) {
    var ok = true, why = '';
    if (s.ended || s.phase !== 'act') { ok = false; }
    else if (a.e > s.energy) { ok = false; why = '精力不够'; }
    else if (a.m && s.money < a.m) { ok = false; why = '钱不够'; }
    else if (a.ok && !a.ok(s)) { ok = false; why = a.why || ''; }
    return { id: a.id, n: a.n, e: a.e, m: a.m || 0, d: a.d, ok: ok, why: why, param: a.param || null };
  });
}
function act(s, id, param) {
  var a = byId(ACTIONS, id);
  if (!a || s.ended || s.phase !== 'act') return null;
  if (a.e > s.energy || (a.m && s.money < a.m) || (a.ok && !a.ok(s))) return null;
  var msg = a.run(s, param);
  if (msg == null) return null;
  s.energy -= a.e; if (a.m) s.money -= a.m;
  s.c[id] = cnt(s, id) + 1; s.st.acts++;
  checkInstant(s);
  return msg;
}

// ---------- 结算 ----------
function reachOf(s) {
  var r = CFG.B0 * s.W * s.W + s.rF * CFG.kF;

  function summary(turn, sum) {
    updBar();
    var best = null; sum.posts.forEach(function (p) { if (!best || p.views > best.views) best = p; });
    var notes = sum.notes.slice();
    if (!sum.posts.length) notes.unshift('这四天你一条帖子都没发。账号权重在往下掉。');
    var head = best && best.viral ? ['有一条爆了', '爆了。你的手在抖', '通知栏炸了'] : sum.dF > 500 ? ['涨得不错', '今天可以多加一个蛋', '数据好得不像你的号'] : sum.dF > 0 ? ['涨了一点', '聊胜于无', '蚊子腿也是肉', '又混过了四天'] : sum.dF < 0 ? ['掉粉了', '有人悄悄走了', '粉丝数在往回走'] : ['无事发生', '风平浪静', '平台好像把你忘了'];
    head = head[(turn + Math.abs(Math.round(sum.dF))) % head.length];
    if (S.frozen && !S.ended) notes.push('后台弹出一条通知，你还没来得及点开。');
    var m = sheet('<div class="k">第 ' + turn + ' 回合结算 · 第 ' + turn * D + ' 天</div><h3><i>♠︎</i>' + head + '</h3>' +
      '<div class="delta"><div><small>粉丝</small><b class="' + cls(sum.dF) + '">' + sign(sum.dF, true) + '</b></div>' +
      '<div><small>心态</small><b class="' + cls(sum.dMood) + '">' + sign(sum.dMood) + '</b></div>' +
      '<div><small>钱</small><b class="' + cls(sum.dMoney) + '">' + sign(sum.dMoney, true) + '</b></div></div>' +
      (best ? '<p class="muted" style="font-size:13.5px;margin:0 0 8px">这几天最好的一条：' + fmt(best.views) + ' 浏览（' + Game.PT[best.type].n + '）</p>' : '') +
      (notes.length ? '<ul class="notes">' + notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>' : '') +
      '<button class="btn primary" id="ok">' + (S.ended ? DAYS + ' 天到了' : '下一回合') + '</button>');
    if (S.ended && S.endId && Game.byId(ENDINGS, S.endId) && !Game.byId(ENDINGS, S.endId).when) m.querySelector('#ok').textContent = '……';
    m.querySelector('#ok').onclick = function () { closeSheet(); busy = false; if (S.ended) ending(); else beginTurn(); };
  }
  function menu() {
    var m = sheet('<div class="k">菜单</div><h3><i>♣︎</i>第 ' + S.turn + ' 回合</h3>' +
      '<button class="ch" id="m1">继续玩</button><button class="ch" id="m2">结局图鉴</button><button class="ch" id="mt">' + themeLabel() + '</button><button class="ch" id="m3">存档并回首页</button><button class="ch" id="m4">放弃这一局</button>' +
      '<p class="muted" style="font-size:12px;margin-top:12px">本局种子 ' + S.seed + '</p>');
    m.querySelector('#m1').onclick = closeSheet;
    m.querySelector('#mt').onclick = function () { toggleTheme(); closeSheet(); };
    m.querySelector('#m2').onclick = function () { closeSheet(); dex(game); };
    m.querySelector('#m3').onclick = function () { save(); home(); };
    m.querySelector('#m4').onclick = function () { lsDel('xsim_save'); home(); };
  }

  // ---------- 结局 ----------
  function shareText() {
    var e = Game.endingOf(S), u = pageUrl();
    return '我在「' + GAME + '」里撑到了第 ' + Game.days(S) + ' 天，' + fmt(S.F) + ' 粉。\n结局：「' + e.t + '」\n' + e.q + (u ? '\n' + u : '');
  }
  function ending() {
    closeSheet(); busy = false; app.className = '';
    var e = Game.endingOf(S);
    if (!S.done) {
      S.done = true; S.endText = Game.endingText(S);
      var achs = Game.achsOf(S); S.newAchs = achs.filter(function (a) { return !META.achs[a]; });
      S.firstTime = !META.endings[e.id];
      achs.forEach(function (a) { META.achs[a] = 1; });
      META.endings[e.id] = (META.endings[e.id] || 0) + 1; META.runs++; META.best = Math.max(META.best, S.st.peak);
      lsSet('xsim_meta', META); save();
    }
    var banned = /^ban/.test(e.id);
    app.innerHTML = '<div class="page"><div class="end scroll" style="flex:1">' +
      '<div class="k">' + (banned ? '账号已停用' : '结局') + ' · 第 ' + Game.days(S) + ' 天' + (S.firstTime ? ' · <span class="gold">新结局</span>' : '') + '</div>' +
      '<h2>' + esc(e.t) + '</h2><p class="d">' + esc(S.endText) + '</p>' +
      '<div class="kv"><div><small>粉丝</small><b>' + fmt(S.F) + '</b></div><div><small>真粉率</small><b>' + Math.round(Game.realPct(S) * 100) + '%</b></div><div><small>赚到</small><b>¥' + fmt(S.st.earned) + '</b></div>' +
      '<div><small>发帖</small><b>' + S.st.posts + '</b></div><div><small>最高浏览</small><b>' + fmt(S.st.maxViews) + '</b></div><div><small>口碑</small><b>' + Math.round(S.rep) + '</b></div></div>' +
      (S.newAchs && S.newAchs.length ? '<div class="newach">解锁成就：' + S.newAchs.map(function (id) { var a = Game.byId(ACHS, id); return '<b>' + esc(a.t) + '</b>'; }).join('、') + '</div>' : '') +
      '<img class="cardimg" id="cardimg" alt="战绩卡"><div class="hint">长按图片可以保存，发到评论区</div>' +
      '<button class="btn primary" id="again">再来一局</button>' +
      '<div class="row"><button class="btn small" id="savec">保存战绩卡</button><button class="btn small" id="copy">复制战绩</button></div>' +
      '<div class="row"><a class="btn small" id="tox" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">发到 X</a>' +
      '<a class="btn small" target="_blank" rel="noopener" style="text-decoration:none;color:inherit" href="https://x.com/' + AUTHOR.handle + '">关注作者</a></div>' +
      '<button class="btn small" id="dex2">结局图鉴 ' + Object.keys(META.endings).length + ' / ' + ENDINGS.length + '</button>' +
      '<p class="muted" style="font-size:12px;text-align:center;margin:14px 0 0">本局种子 ' + S.seed + '</p>' + footHtml() + '</div></div>';
    var url = '';
    try { url = drawCard().toDataURL('image/png'); document.getElementById('cardimg').src = url; } catch (err) { document.getElementById('cardimg').style.display = 'none'; }
    document.getElementById('again').onclick = function () { lsDel('xsim_save'); setup(); };
    document.getElementById('dex2').onclick = function () { dex(ending); };
    document.getElementById('tox').href = 'https://x.com/intent/post?text=' + encodeURIComponent(shareText());
    document.getElementById('savec').onclick = function () {
      if (!url) return; var a = document.createElement('a'); a.href = url; a.download = 'x-sim-' + e.id + '.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a); toast('存不下来的话，长按图片保存');
    };
    document.getElementById('copy').onclick = function () {
      var t = shareText();
      function fb() { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('已复制'); } catch (er) { toast('复制失败'); } document.body.removeChild(ta); }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast('已复制'); }, fb); else fb();
    };
  }
  function wrap(ctx, text, maxW) {
    var lines = [], line = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (ch === '\n') { lines.push(line); line = ''; continue; }
      if (ctx.measureText(line + ch).width > maxW && line) {
        if ('，。、！？：；）」』”'.indexOf(ch) >= 0) { line += ch; lines.push(line); line = ''; continue; }
        lines.push(line); line = ch;
      } else line += ch;
    }
    if (line) lines.push(line); return lines;
  }
  function drawCard() {
    var W = 900, H = 1200, c = document.createElement('canvas'); c.width = W; c.height = H;
    var x = c.getContext('2d'), e = Game.endingOf(S);
    var serif = '"Songti SC","Noto Serif SC","Source Han Serif SC",STSong,SimSun,serif';
    var sans = '-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    var mono = 'Menlo,Consolas,monospace';
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(15,20,25,.05)'; x.font = '700 760px ' + serif; x.textAlign = 'center'; x.fillText(/^ban/.test(e.id) ? '♠︎' : '♥︎', W - 190, H - 250);
    x.strokeStyle = '#0f1419'; x.lineWidth = 4; x.strokeRect(34, 34, W - 68, H - 68);
    x.strokeStyle = 'rgba(15,20,25,.18)'; x.lineWidth = 1; x.strokeRect(46, 46, W - 92, H - 92);
    x.textAlign = 'left'; x.fillStyle = '#536471'; x.font = '500 30px ' + sans; x.fillText(GAME, 86, 126);
    x.textAlign = 'right'; x.font = '28px ' + mono; x.fillText('DAY ' + Game.days(S) + ' / ' + DAYS, W - 86, 126);
    x.textAlign = 'left'; x.fillStyle = '#d63a2f'; x.font = '500 30px ' + sans; x.fillText(/^ban/.test(e.id) ? '账号已停用' : '结局', 86, 250);
    x.fillStyle = '#0f1419'; var size = e.t.length > 9 ? 78 : 96; x.font = '700 ' + size + 'px ' + serif;
    var y = 250 + size + 26; wrap(x, e.t, W - 172).forEach(function (l) { x.fillText(l, 86, y); y += size * 1.22; });
    x.fillStyle = '#9c7410'; x.font = '400 38px ' + serif; y += 14;
    wrap(x, '「' + e.q + '」', W - 172).forEach(function (l) { x.fillText(l, 86, y); y += 56; });
    var rows = [['粉丝', fmt(S.F)], ['真粉率', Math.round(Game.realPct(S) * 100) + '%'], ['赚到', '¥' + fmt(S.st.earned)], ['发帖', String(S.st.posts)], ['最高浏览', fmt(S.st.maxViews)], ['口碑', String(Math.round(S.rep))]];
    var gy = Math.max(y + 40, 690), cw = (W - 172) / 3;
    rows.forEach(function (r, i) {
      var cx = 86 + (i % 3) * cw, cy = gy + Math.floor(i / 3) * 150;
      x.fillStyle = '#84909a'; x.font = '26px ' + sans; x.fillText(r[0], cx, cy);
      x.fillStyle = '#0f1419'; x.font = '600 50px ' + mono; x.fillText(r[1], cx, cy + 62);
    });
    x.fillStyle = '#536471'; x.font = '26px ' + sans;
    x.fillText(Game.byId(ORIGINS, S.origin).n + ' · ' + Game.byId(NICHES, S.niche).n + ' · 种子 ' + S.seed, 86, gy + 296);
    x.strokeStyle = '#dfe5e8'; x.beginPath(); x.moveTo(86, H - 182); x.lineTo(W - 86, H - 182); x.stroke();
    x.fillStyle = '#0f1419'; x.font = '500 28px ' + sans; x.fillText('作者 ' + AUTHOR.name + ' @' + AUTHOR.handle, 86, H - 126);
    var u = pageUrl().replace(/^https?:\/\//, '').replace(/\/(index\.html)?$/, '');
    if (u) { x.fillStyle = '#d63a2f'; x.font = '26px ' + mono; if (x.measureText(u).width < W - 172) x.fillText(u, 86, H - 82); }
    return c;
  }

  // ---------- 图鉴 ----------
  function dex(back) {
    var got = Object.keys(META.endings).length, ga = Object.keys(META.achs).length; app.className = '';
    app.innerHTML = '<div class="page"><div class="page-h"><h2>图鉴</h2><button class="muted" id="back">返回</button></div><div class="page-b scroll">' +
      '<div class="sec">结局 ' + got + ' / ' + ENDINGS.length + ' · 玩了 ' + META.runs + ' 局</div><div class="dex">' +
      ENDINGS.map(function (e) { var n = META.endings[e.id];
        return n ? '<div class="dx got"><b>' + esc(e.t) + '</b><span>' + esc(e.q) + '</span></div>' : '<div class="dx lock"><b>? ? ?</b><span>' + (e.hidden ? '隐藏结局' : '还没遇到') + '</span></div>'; }).join('') +
      '</div><div class="sec">成就 ' + ga + ' / ' + ACHS.length + '</div><div class="dex">' +
      ACHS.map(function (a) { return META.achs[a.id] ? '<div class="dx got"><b>' + esc(a.t) + '</b><span>' + esc(a.d) + '</span></div>' : '<div class="dx lock"><b>? ? ?</b><span>' + esc(a.d) + '</span></div>'; }).join('') +
      '</div>' + footHtml() + '</div></div>';
    document.getElementById('back').onclick = back || home;
  }

  if (mq) { var onMq = function () { if (S && app.className === 'game' && !busy && !document.getElementById('mask')) game(); }; if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq); }
  window.__xsim = { home: home, state: function () { return S; } };
  home();
})();

</script>
